<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075B32" />
      <stop offset="100%" stop-color="#04381e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00" />
      <stop offset="50%" stop-color="#F4B400" />
      <stop offset="100%" stop-color="#C68A00" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#008A4B" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#F4B400" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#075B32" stop-opacity="0" />
    </radialGradient>
    <path id="textCircleTop" d="M 60,250 A 190,190 0 1,1 440,250" fill="none" />
    <path id="textCircleBottom" d="M 440,250 A 190,190 0 0,1 60,250" fill="none" />
  </defs>

  <!-- Outer Ring with Tricolor / Blue boundary -->
  <circle cx="250" cy="250" r="242" fill="#FFFFFF" stroke="#075B32" stroke-width="6" />
  <circle cx="250" cy="250" r="234" fill="url(#bgGrad)" stroke="#F4B400" stroke-width="4" />

  <!-- Circular Outer Text Track -->
  <circle cx="250" cy="250" r="195" fill="none" stroke="rgba(244, 180, 0, 0.4)" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- English Circular Text -->
  <text fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="3.5">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      SARVA SAMRUDDHI INDEPENDENT PARTY
    </textPath>
  </text>
  <text fill="#FFDF00" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      ★ DEVERAKONDA CONSTITUENCY • TELANGANA ★
    </textPath>
  </text>

  <!-- Inner Medallion -->
  <circle cx="250" cy="250" r="148" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="5" />
  <circle cx="250" cy="250" r="142" fill="#F8FAF8" />

  <!-- Sun Rays in Inner Medallion -->
  <circle cx="250" cy="235" r="105" fill="url(#sunGlow)" />

  <!-- Rays of Sun -->
  <g stroke="#F4B400" stroke-width="2.5" opacity="0.45" stroke-linecap="round">
    <line x1="250" y1="210" x2="250" y2="135" />
    <line x1="250" y1="210" x2="200" y2="145" />
    <line x1="250" y1="210" x2="300" y2="145" />
    <line x1="250" y1="210" x2="160" y2="175" />
    <line x1="250" y1="210" x2="340" y2="175" />
    <line x1="250" y1="210" x2="135" y2="220" />
    <line x1="250" y1="210" x2="365" y2="220" />
  </g>

  <!-- Flourishing Banyan Tree of Prosperity (Symbolizing Collective Growth) -->
  <!-- Roots (Values & Grassroots Foundation) -->
  <g stroke="#78350F" stroke-width="4.5" fill="none" stroke-linecap="round">
    <path d="M 240,325 Q 220,355 185,365" />
    <path d="M 245,330 Q 235,360 215,372" />
    <path d="M 250,335 L 250,378" stroke-width="5" stroke="#075B32" />
    <path d="M 255,330 Q 265,360 285,372" />
    <path d="M 260,325 Q 280,355 315,365" />
  </g>

  <!-- Soil / Foundation Line -->
  <path d="M 160,345 Q 250,352 340,345" stroke="#123B78" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M 175,352 Q 250,358 325,352" stroke="#E31B23" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Tree Trunk (Solid Institutional Structure) -->
  <path d="M 235,340 C 236,300 220,270 205,250 C 225,258 245,260 250,265 C 255,260 275,258 295,250 C 280,270 264,300 265,340 Z" fill="#8B4513" stroke="#5C2E0B" stroke-width="2" />
  <path d="M 248,340 L 248,268 M 252,340 L 252,268" stroke="#F4B400" stroke-width="1.5" opacity="0.7" />

  <!-- Dense Green Foliage & Canopy (Canopy of Prosperity) -->
  <g fill="url(#leafGrad)" stroke="#075B32" stroke-width="2.5">
    <circle cx="250" cy="180" r="42" />
    <circle cx="215" cy="195" r="38" />
    <circle cx="285" cy="195" r="38" />
    <circle cx="185" cy="225" r="34" />
    <circle cx="315" cy="225" r="34" />
    <circle cx="230" cy="225" r="32" />
    <circle cx="270" cy="225" r="32" />
    <circle cx="250" cy="235" r="30" />
  </g>

  <!-- Accent Fruits / Prosperity Gold Discs -->
  <g fill="#F4B400" stroke="#FFFFFF" stroke-width="1.5">
    <circle cx="225" cy="185" r="6" />
    <circle cx="275" cy="185" r="6" />
    <circle cx="200" cy="220" r="5.5" />
    <circle cx="300" cy="220" r="5.5" />
    <circle cx="250" cy="165" r="7" />
    <circle cx="250" cy="210" r="6" />
    <circle cx="175" cy="235" r="5" />
    <circle cx="325" cy="235" r="5" />
  </g>
</svg>
